name: Build Release Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild
        required: true
        default: v2.0.0

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out release version
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate addon
        run: bash scripts/validate-addon.sh

      - name: Verify release version
        shell: bash
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          TOC_VERSION=$(awk -F: '
            /^## Version:/ {
              gsub(/^[ \t]+|[ \t\r]+$/, "", $2)
              print $2
              exit
            }
          ' AltTrackingAssistant.toc)

          if [ "$TAG_VERSION" != "$TOC_VERSION" ]; then
            echo "ERROR: Release tag and TOC version do not match."
            exit 1
          fi

  build-release:
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Check out release version
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        run: python -m pip install pyinstaller -r Companion/requirements.txt

      - name: Build companion executable
        shell: pwsh
        run: ./Companion/build_exe.ps1

      - name: Build combined package
        shell: pwsh
        run: |
          $packageDir = 'build/release/AltTrackingAssistant'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          foreach ($folder in @('Core', 'Features', 'Media', 'UI')) {
            Copy-Item -LiteralPath $folder -Destination $packageDir -Recurse
          }

          foreach ($file in @(
            'AltTrackingAssistant.toc',
            'AltTrackingAssistantCompanion.exe',
            'README.md',
            'CHANGELOG.md',
            'LICENSE'
          )) {
            Copy-Item -LiteralPath $file -Destination $packageDir
          }

          Copy-Item -LiteralPath scripts/AppSync.default.lua -Destination "$packageDir/AppSync.lua"
          Copy-Item -LiteralPath Companion/README.md -Destination "$packageDir/Companion-README.md"

          $zipName = "AltTrackingAssistant-$env:RELEASE_TAG.zip"
          Compress-Archive -LiteralPath $packageDir -DestinationPath $zipName -Force

      - name: Attach combined ZIP to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:RELEASE_TAG" "AltTrackingAssistant-$env:RELEASE_TAG.zip" --clobber