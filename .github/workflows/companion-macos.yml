name: Build macOS Companion

on:
  push:
    branches: [main]
    paths: ['Companion/**', '.github/workflows/companion-macos.yml']
  pull_request:
    paths: ['Companion/**', '.github/workflows/companion-macos.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: ${{ matrix.python_arch }}
      - name: Install dependencies
        run: python -m pip install pyinstaller -r Companion/requirements.txt
      - name: Test companion on macOS
        run: python -m unittest discover -s Companion -p 'test_*.py'
      - name: Build app bundle
        run: PYTHON_EXECUTABLE="$(command -v python)" bash Companion/build_macos.sh '${{ matrix.arch }}'
      - name: Verify and launch packaged app
        run: |
          bundle=Companion/dist/macos/AltTrackingAssistantCompanion.app
          executable="$bundle/Contents/MacOS/AltTrackingAssistantCompanion"
          lipo -verify_arch '${{ matrix.arch }}' "$executable"
          codesign --verify --deep --strict "$bundle"
          python Companion/verify_macos.py "$bundle"
      - name: Package app and instructions
        run: |
          mkdir -p build/macos-package
          cp -R Companion/dist/macos/AltTrackingAssistantCompanion.app build/macos-package/
          cp Companion/README.md build/macos-package/Companion-README.md
          cp LICENSE build/macos-package/
          ditto -c -k --sequesterRsrc --keepParent build/macos-package "AltTrackingAssistantCompanion-macOS-${{ matrix.arch }}.zip"
      - name: Save downloadable Mac app
        uses: actions/upload-artifact@v4
        with:
          name: companion-macOS-${{ matrix.arch }}
          path: AltTrackingAssistantCompanion-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
